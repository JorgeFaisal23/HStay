# App + PostgreSQL para el VPS.
#
#   cp .env.production.example .env.production   # y llénalo
#   docker compose up -d --build
#
# Las migraciones se aplican solas al arrancar el contenedor de la app.
# Si ya tienes un PostgreSQL propio, borra el servicio `db`, quita el
# depends_on y apunta DATABASE_URL a tu base.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apprentas}
      POSTGRES_USER: ${POSTGRES_USER:-apprentas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.production}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-HStay}
        NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-Administración de rentas}
        NEXT_PUBLIC_APP_COLOR: ${NEXT_PUBLIC_APP_COLOR:-#12263F}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    image: apprentas:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apprentas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apprentas}
      DIRECT_URL: postgresql://${POSTGRES_USER:-apprentas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-apprentas}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
